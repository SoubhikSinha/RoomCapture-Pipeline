[project]
name = "roomcapture-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
